name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: aiflow_test
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: aiflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://aiflow:aiflow@127.0.0.1:5432/aiflow_test
      TEST_DATABASE_URL: postgresql://aiflow:aiflow@127.0.0.1:5432/aiflow_test
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 认证与工作流集成测试共用独立测试库；生成客户端后先部署全部迁移。
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:style
      - run: pnpm spellcheck
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
